<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Лисёнок учит английский</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#BFE9F5;
    --sky-deep:#9FDCEF;
    --grass:#7FC873;
    --grass-dark:#5CA860;
    --sun:#FFD166;
    --coral:#FF7F5C;
    --coral-dark:#E86A4C;
    --ink:#2B3A3A;
    --white:#FFFFFF;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:'Baloo 2', system-ui, sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 100%);
    overflow-x:hidden;
    min-height:100vh;
    -webkit-user-select:none; user-select:none;
  }
  .screen{ display:none; min-height:100vh; flex-direction:column; align-items:center; padding:20px 16px 40px; }
  .screen.active{ display:flex; }

  /* --- decorations --- */
  .cloud{ position:fixed; font-size:34px; opacity:.85; pointer-events:none; z-index:0; }
  .sun-deco{ position:fixed; top:18px; right:22px; font-size:46px; z-index:0; }

  /* --- start screen --- */
  #screen-start .fox-big{ font-size:110px; margin-top:8vh; filter:drop-shadow(0 8px 10px rgba(0,0,0,.15)); }
  #screen-start h1{ font-size:28px; font-weight:800; text-align:center; margin:6px 0 4px; }
  #screen-start p{ text-align:center; font-size:16px; font-weight:600; color:#3d5555; margin:0 0 28px; max-width:280px; }
  .btn-big{
    background:var(--coral); color:#fff; border:none; border-radius:999px;
    font-family:inherit; font-weight:700; font-size:22px; padding:16px 46px;
    box-shadow:0 5px 0 var(--coral-dark); cursor:pointer;
  }
  .btn-big:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--coral-dark); }

  /* --- map / path screen --- */
  #screen-map{ position:relative; width:100%; max-width:420px; margin:0 auto; padding-top:16px; z-index:1; }
  .map-header{ display:flex; align-items:center; justify-content:center; width:100%; margin-bottom:6px; }
  .map-title{ font-size:22px; font-weight:800; }
  .trail{ position:relative; width:100%; padding:20px 0 60px; display:flex; flex-direction:column-reverse; align-items:center; }
  .stone-row{ position:relative; display:flex; width:100%; justify-content:center; margin:6px 0; }
  .stone-row.left{ justify-content:flex-start; padding-left:14%; }
  .stone-row.right{ justify-content:flex-end; padding-right:14%; }
  .stone{
    position:relative; width:78px; height:78px; border-radius:50%;
    background:var(--grass); border:4px solid var(--grass-dark);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    font-size:30px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.12);
  }
  .stone.locked{ background:#cfd9d3; border-color:#b7c4bd; opacity:.75; cursor:default; }
  .stone .stars{ position:absolute; bottom:-14px; font-size:12px; letter-spacing:1px; }
  .stone .mascot-here{ position:absolute; top:-46px; font-size:40px; animation:bob 1.6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
  .stone-label{ position:absolute; top:86px; font-size:12px; font-weight:700; width:110px; text-align:center; left:50%; transform:translateX(-50%); color:#2B3A3A; }

  /* --- level play screen --- */
  #screen-level{ width:100%; max-width:420px; margin:0 auto; }
  .level-topbar{ display:flex; align-items:center; gap:10px; width:100%; margin-bottom:18px; }
  .back-btn{ background:var(--white); border:none; border-radius:50%; width:44px; height:44px; font-size:20px; box-shadow:0 3px 0 rgba(0,0,0,.1); cursor:pointer; }
  .dots{ display:flex; gap:6px; flex:1; justify-content:center; flex-wrap:wrap; }
  .dot{ width:12px; height:12px; border-radius:50%; background:#d8e6df; }
  .dot.done{ background:var(--sun); }
  .dot.current{ background:var(--coral); }

  .game-card{
    background:var(--white); border-radius:26px; width:100%; padding:28px 20px 24px;
    display:flex; flex-direction:column; align-items:center; box-shadow:0 8px 0 rgba(0,0,0,.08);
    min-height:360px; justify-content:space-between;
  }
  .instruction{ font-size:16px; font-weight:700; text-align:center; color:#3d5555; margin-bottom:6px; }
  .word-emoji{ font-size:90px; margin:10px 0; }
  .replay-btn{ background:var(--sky); border:none; border-radius:999px; padding:10px 22px; font-family:inherit; font-weight:700; font-size:16px; cursor:pointer; color:var(--ink); }

  .choices{ display:flex; gap:16px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  .choice-btn{
    background:var(--sky); border:3px solid transparent; border-radius:20px;
    font-size:52px; width:96px; height:96px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .choice-btn.correct{ background:#d3f2d0; border-color:#5CA860; }
  .choice-btn.wrong{ background:#ffd9d0; border-color:var(--coral); }

  .mic-big{
    width:100px; height:100px; border-radius:50%; border:none; background:var(--coral);
    color:#fff; font-size:42px; box-shadow:0 5px 0 var(--coral-dark); cursor:pointer; margin-top:10px;
  }
  .mic-big.listening{ background:#ff4d4d; animation:pulse 1s infinite; }
  @keyframes pulse{ 0%{ box-shadow:0 5px 0 var(--coral-dark), 0 0 0 0 rgba(255,77,77,.5);} 100%{ box-shadow:0 5px 0 var(--coral-dark), 0 0 0 18px rgba(255,77,77,0);} }

  .feedback-line{ font-size:18px; font-weight:700; min-height:26px; text-align:center; margin-top:10px; }
  .feedback-line.good{ color:#3a9a45; }
  .feedback-line.bad{ color:var(--coral-dark); }

  .next-btn{ margin-top:12px; background:var(--grass); border:none; border-radius:999px; color:#fff; font-family:inherit; font-weight:700; font-size:18px; padding:10px 30px; box-shadow:0 4px 0 var(--grass-dark); cursor:pointer; display:none; }

  /* --- complete screen --- */
  #screen-complete .fox-big{ font-size:100px; margin-top:6vh; }
  #screen-complete h2{ font-size:26px; font-weight:800; margin:6px 0; }
  .stars-big{ font-size:44px; letter-spacing:6px; margin:8px 0 20px; }
  .row-btns{ display:flex; gap:14px; margin-top:6px; }
  .btn-secondary{ background:var(--white); color:var(--ink); border:none; border-radius:999px; font-family:inherit; font-weight:700; font-size:16px; padding:12px 24px; box-shadow:0 4px 0 rgba(0,0,0,.1); cursor:pointer; }
</style>
</head>
<body>

<div class="sun-deco">☀️</div>
<div class="cloud" style="top:70px; left:8%;">☁️</div>
<div class="cloud" style="top:130px; right:14%; font-size:26px;">☁️</div>

<!-- START -->
<div class="screen active" id="screen-start">
  <div class="fox-big">🦊</div>
  <h1>Лисёнок учит английский</h1>
  <p>Слушай, выбирай и повторяй слова вместе с лисёнком!</p>
  <button class="btn-big" id="startBtn">▶ Играть</button>
</div>

<!-- MAP -->
<div class="screen" id="screen-map">
  <div class="map-header"><div class="map-title">🗺️ Тропинка лисёнка</div></div>
  <div class="trail" id="trail"></div>
</div>

<!-- LEVEL PLAY -->
<div class="screen" id="screen-level">
  <div class="level-topbar">
    <button class="back-btn" id="levelBackBtn">←</button>
    <div class="dots" id="dots"></div>
  </div>
  <div class="game-card">
    <div>
      <div class="instruction" id="instruction">Слушай...</div>
      <div class="word-emoji" id="wordEmoji">🎨</div>
      <div style="text-align:center;"><button class="replay-btn" id="replayBtn">🔊 Ещё раз</button></div>
    </div>

    <div id="choicesWrap" class="choices"></div>
    <button class="mic-big" id="micBig" style="display:none;">🎤</button>

    <div style="width:100%;">
      <div class="feedback-line" id="feedbackLine"></div>
      <div style="display:flex; justify-content:center;">
        <button class="next-btn" id="nextBtn">Дальше ▶</button>
      </div>
    </div>
  </div>
</div>

<!-- COMPLETE -->
<div class="screen" id="screen-complete">
  <div class="fox-big">🦊🎉</div>
  <h2 id="completeTitle">Уровень пройден!</h2>
  <div class="stars-big" id="completeStars">⭐⭐⭐</div>
  <div class="row-btns">
    <button class="btn-secondary" id="toMapBtn">🗺️ На тропинку</button>
    <button class="btn-big" id="replayLevelBtn" style="padding:12px 26px; font-size:16px;">↻ Ещё раз</button>
  </div>
</div>

<script>
// ---------------------------------------------------------------
// Данные уровней. Легко расширять: просто добавь новый объект.
// ---------------------------------------------------------------
const LEVELS = [
  { id:'colors',  title:'Цвета',    icon:'🎨', words:[
      {en:'red',    ru:'красный', emoji:'🔴'},
      {en:'blue',   ru:'синий',   emoji:'🔵'},
      {en:'green',  ru:'зелёный', emoji:'🟢'},
      {en:'yellow', ru:'жёлтый',  emoji:'🟡'},
      {en:'purple', ru:'фиолетовый', emoji:'🟣'},
  ]},
  { id:'numbers', title:'Числа',    icon:'🔢', words:[
      {en:'one',   ru:'один',   emoji:'1️⃣'},
      {en:'two',   ru:'два',    emoji:'2️⃣'},
      {en:'three', ru:'три',    emoji:'3️⃣'},
      {en:'four',  ru:'четыре', emoji:'4️⃣'},
      {en:'five',  ru:'пять',   emoji:'5️⃣'},
  ]},
  { id:'animals', title:'Животные', icon:'🐾', words:[
      {en:'cat',  ru:'кошка',   emoji:'🐱'},
      {en:'dog',  ru:'собака',  emoji:'🐶'},
      {en:'fish', ru:'рыба',    emoji:'🐟'},
      {en:'bird', ru:'птица',   emoji:'🐦'},
      {en:'frog', ru:'лягушка', emoji:'🐸'},
  ]},
];

// ---------------------------------------------------------------
// Прогресс (localStorage)
// ---------------------------------------------------------------
const PROGRESS_KEY = 'fox_english_progress_v1';
function loadProgress(){
  try{
    const raw = localStorage.getItem(PROGRESS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function saveProgress(p){
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(p));
}
let progress = loadProgress();

function isUnlocked(index){
  if(index === 0) return true;
  const prev = LEVELS[index-1];
  return !!(progress[prev.id] && progress[prev.id].stars > 0);
}
function starsFor(levelId){
  return (progress[levelId] && progress[levelId].stars) || 0;
}

// ---------------------------------------------------------------
// Экран / навигация
// ---------------------------------------------------------------
const screens = {
  start: document.getElementById('screen-start'),
  map: document.getElementById('screen-map'),
  level: document.getElementById('screen-level'),
  complete: document.getElementById('screen-complete'),
};
function showScreen(name){
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
}

document.getElementById('startBtn').addEventListener('click', ()=>{
  renderMap();
  showScreen('map');
});
document.getElementById('toMapBtn').addEventListener('click', ()=>{
  renderMap();
  showScreen('map');
});
document.getElementById('levelBackBtn').addEventListener('click', ()=>{
  stopRecognitionIfAny();
  renderMap();
  showScreen('map');
});

// ---------------------------------------------------------------
// Карта / тропинка
// ---------------------------------------------------------------
const trailEl = document.getElementById('trail');
function renderMap(){
  trailEl.innerHTML = '';
  LEVELS.forEach((lvl, i)=>{
    const unlocked = isUnlocked(i);
    const stars = starsFor(lvl.id);
    const isCurrent = unlocked && stars === 0;

    const row = document.createElement('div');
    row.className = 'stone-row ' + (i % 2 === 0 ? 'left' : 'right');

    const stone = document.createElement('div');
    stone.className = 'stone' + (unlocked ? '' : ' locked');
    stone.innerHTML = (unlocked ? lvl.icon : '🔒') +
      (stars > 0 ? `<div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>` : '');

    const label = document.createElement('div');
    label.className = 'stone-label';
    label.textContent = lvl.title;
    stone.appendChild(label);

    if(isCurrent){
      const mascot = document.createElement('div');
      mascot.className = 'mascot-here';
      mascot.textContent = '🦊';
      stone.appendChild(mascot);
    }

    if(unlocked){
      stone.addEventListener('click', ()=> startLevel(i));
    }
    row.appendChild(stone);
    trailEl.appendChild(row);
  });
}

// ---------------------------------------------------------------
// Звук: синтез речи
// ---------------------------------------------------------------
function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.85;
  u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}

// ---------------------------------------------------------------
// Распознавание речи (только для механики "Повтори")
// ---------------------------------------------------------------
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
if(SpeechRecognitionAPI){
  recognition = new SpeechRecognitionAPI();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
}
function stopRecognitionIfAny(){
  if(recognition){ try{ recognition.stop(); }catch(e){} }
  window.speechSynthesis && window.speechSynthesis.cancel();
}
function normalize(s){
  return (s||'').toLowerCase().replace(/[^a-z]/g,'').trim();
}
function levenshtein(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1}, ()=> new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
// Ребёнок произносит слова неидеально — проверяем не только точное
// совпадение, но и близкие по звучанию варианты (расстояние Левенштейна),
// а также все альтернативные варианты распознавания, а не только первый.
function isCloseMatch(said, expected){
  const s = normalize(said);
  const e = normalize(expected);
  if(!s) return false;
  if(s === e || s.includes(e) || e.includes(s)) return true;
  const maxDist = e.length <= 4 ? 1 : 2;
  return levenshtein(s, e) <= maxDist;
}

// ---------------------------------------------------------------
// Игровая сессия уровня
// ---------------------------------------------------------------
let session = null; // { level, rounds:[], index, correctCount }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildRounds(level){
  let rounds = [];
  level.words.forEach(w=>{
    rounds.push({ type:'listen', word:w });
    rounds.push({ type:'repeat', word:w });
  });
  return shuffle(rounds);
}

function startLevel(index){
  const level = LEVELS[index];
  session = {
    levelIndex: index,
    level,
    rounds: buildRounds(level),
    index: 0,
    correctCount: 0,
    solvedThisRound: false,
    advanced: false,
  };
  showScreen('level');
  renderDots();
  loadRound();
}

const dotsEl = document.getElementById('dots');
function renderDots(){
  dotsEl.innerHTML = '';
  session.rounds.forEach((r, i)=>{
    const d = document.createElement('div');
    d.className = 'dot' + (i < session.index ? ' done' : (i === session.index ? ' current' : ''));
    dotsEl.appendChild(d);
  });
}

const instructionEl = document.getElementById('instruction');
const wordEmojiEl = document.getElementById('wordEmoji');
const choicesWrap = document.getElementById('choicesWrap');
const micBig = document.getElementById('micBig');
const feedbackLine = document.getElementById('feedbackLine');
const nextBtn = document.getElementById('nextBtn');
const replayBtn = document.getElementById('replayBtn');

function currentRound(){ return session.rounds[session.index]; }

function loadRound(){
  stopRecognitionIfAny();
  const round = currentRound();
  session.solvedThisRound = false;
  feedbackLine.textContent = '';
  feedbackLine.className = 'feedback-line';
  nextBtn.style.display = 'none';
  renderDots();

  if(round.type === 'listen'){
    instructionEl.textContent = 'Послушай и выбери картинку';
    wordEmojiEl.textContent = '🔊';
    choicesWrap.style.display = 'flex';
    micBig.style.display = 'none';
    renderChoices(round.word);
  } else {
    instructionEl.textContent = 'Послушай и повтори вслух';
    wordEmojiEl.textContent = round.word.emoji;
    choicesWrap.style.display = 'none';
    choicesWrap.innerHTML = '';
    micBig.style.display = 'inline-block';
    micBig.classList.remove('listening');
  }
  setTimeout(()=> speak(round.word.en), 350);
}

replayBtn.addEventListener('click', ()=>{
  speak(currentRound().word.en);
});

function renderChoices(correctWord){
  const level = session.level;
  const others = level.words.filter(w => w.en !== correctWord.en);
  const distractors = shuffle(others).slice(0, 2);
  const options = shuffle([correctWord, ...distractors]);

  choicesWrap.innerHTML = '';
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt.emoji;
    btn.addEventListener('click', ()=> handleChoice(btn, opt, correctWord));
    choicesWrap.appendChild(btn);
  });
}

function handleChoice(btn, opt, correctWord){
  if(session.solvedThisRound) return;
  if(opt.en === correctWord.en){
    btn.classList.add('correct');
    onRoundCorrect();
  } else {
    btn.classList.add('wrong');
    feedbackLine.textContent = 'Попробуй ещё раз 🙂';
    feedbackLine.className = 'feedback-line bad';
    setTimeout(()=> btn.classList.remove('wrong'), 500);
  }
}

let recognizing = false;

micBig.addEventListener('click', ()=>{
  if(!recognition){
    feedbackLine.textContent = 'На этом устройстве нет распознавания речи';
    feedbackLine.className = 'feedback-line bad';
    return;
  }
  if(session.solvedThisRound || recognizing) return;

  const expected = currentRound().word.en;

  recognition.maxAlternatives = 5;
  recognition.onstart = ()=>{
    recognizing = true;
    micBig.classList.add('listening');
    feedbackLine.textContent = 'Слушаю...';
    feedbackLine.className = 'feedback-line';
  };
  recognition.onresult = (event)=>{
    const alternatives = event.results[0];
    let matched = false;
    for(let i=0; i<alternatives.length; i++){
      if(isCloseMatch(alternatives[i].transcript, expected)){ matched = true; break; }
    }
    if(matched){
      onRoundCorrect();
    } else {
      feedbackLine.textContent = 'Почти! Повтори: "' + expected + '"';
      feedbackLine.className = 'feedback-line bad';
    }
  };
  recognition.onerror = (event)=>{
    recognizing = false;
    micBig.classList.remove('listening');
    const msg = event.error === 'no-speech'
      ? 'Не услышал голос, нажми на микрофон и говори сразу'
      : event.error === 'not-allowed'
      ? 'Доступ к микрофону запрещён в настройках браузера'
      : 'Не расслышал, нажми ещё раз 🎤';
    feedbackLine.textContent = msg;
    feedbackLine.className = 'feedback-line bad';
  };
  recognition.onend = ()=>{
    recognizing = false;
    micBig.classList.remove('listening');
  };

  try{
    recognition.start();
  }catch(e){
    // Например, распознавание уже было запущено и не успело закрыться —
    // сбрасываем состояние, чтобы кнопка не зависала навсегда.
    recognizing = false;
    micBig.classList.remove('listening');
    try{ recognition.abort(); }catch(e2){}
    feedbackLine.textContent = 'Нажми на микрофон ещё раз';
    feedbackLine.className = 'feedback-line bad';
  }
});

function onRoundCorrect(){
  session.solvedThisRound = true;
  session.correctCount++;
  session.advanced = false;
  feedbackLine.textContent = '✅ Отлично!';
  feedbackLine.className = 'feedback-line good';
  nextBtn.style.display = 'inline-block';
  setTimeout(()=>{
    if(!session.advanced) goNextRound();
  }, 1400);
}

nextBtn.addEventListener('click', goNextRound);

function goNextRound(){
  if(session.advanced) return;
  session.advanced = true;
  session.index++;
  if(session.index >= session.rounds.length){
    finishLevel();
  } else {
    loadRound();
  }
}

function finishLevel(){
  stopRecognitionIfAny();
  const pct = session.correctCount / session.rounds.length;
  const stars = pct >= 0.9 ? 3 : pct >= 0.6 ? 2 : 1;
  const level = session.level;
  const prevStars = starsFor(level.id);
  progress[level.id] = { stars: Math.max(prevStars, stars) };
  saveProgress(progress);

  document.getElementById('completeStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
  document.getElementById('completeTitle').textContent = 'Тема «' + level.title + '» пройдена!';
  showScreen('complete');
}

document.getElementById('replayLevelBtn').addEventListener('click', ()=>{
  startLevel(session.levelIndex);
});
</script>
</body>
</html>
